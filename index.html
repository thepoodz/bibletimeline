<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bible Timeline</title>
  
  <!-- Scroll Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --col-year-width: 68px;
      --scrubber-width: 38px;
      --toolbar-height: 45px;
      --header-height: 48px;
      --header-total-height: calc(var(--toolbar-height) + var(--header-height));
      --canvas-top-padding: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      touch-action: pan-y;
    }

    /* --- Sticky Top Controls Toolbar --- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--toolbar-height);
      background-color: #090d16;
      border-bottom: 1px solid var(--border-color);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
    }

    /* Zoom Controls */
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px 12px;
    }

    .zoom-level-text {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 38px;
      text-align: left;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--accent-gold);
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      border-radius: 50%;
      user-select: none;
      transition: background 0.15s ease;
    }

    .zoom-btn:hover {
      background: rgba(245, 158, 11, 0.15);
    }

    .zoom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 85px;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-gold);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .zoom-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .zoom-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-gold);
      border: none;
      cursor: pointer;
    }

    /* --- Layers Control Bar --- */
    .layers-bar {
      position: sticky;
      top: var(--toolbar-height);
      z-index: 95;
      height: var(--header-height);
      background-color: #111827;
      border-bottom: 2px solid var(--border-color);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .layers-bar::-webkit-scrollbar {
      display: none;
    }

    .layer-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .layer-chip.active {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(30, 41, 59, 0.9);
    }

    .layer-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .layer-chip.active .layer-color-dot {
      box-shadow: 0 0 6px currentColor;
    }

    /* --- Timeline Layout --- */
    .timeline-container {
      display: grid;
      grid-template-columns: var(--col-year-width) 1fr var(--scrubber-width);
      width: 100%;
      position: relative;
    }

    .timeline-canvas {
      position: relative;
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: inherit;
      width: 100%;
    }

    /* Left Sticky Year Track */
    .year-track {
      position: relative;
      background-color: #111827;
      border-right: 2px solid var(--border-color);
      z-index: 80;
    }

    .year-marker {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      transform: translateY(-50%);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .year-marker.annual { font-size: 0.58rem; font-weight: 400; color: #475569; }
    .year-marker.decade { font-size: 0.65rem; font-weight: 500; color: var(--text-muted); }
    .year-marker.century { font-size: 0.78rem; font-weight: 700; color: #ffffff; }
    .year-marker.millennium { font-size: 0.92rem; font-weight: 900; color: var(--accent-gold); }

    /* Grid Lines */
    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 5;
    }

    .grid-line.annual { border-top: 1px dotted rgba(100, 116, 139, 0.18); z-index: 4; }
    .grid-line.decade { border-top: 1px dashed rgba(100, 116, 139, 0.2); }
    .grid-line.century { border-top: 1px solid rgba(255, 255, 255, 0.35); }
    .grid-line.millennium { border-top: 1px solid var(--accent-gold); z-index: 6; }

    .data-track {
      position: relative;
      border-right: 1px solid var(--border-color);
      z-index: 10;
    }

    /* Central Spine Line */
    .data-track::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: rgba(51, 65, 85, 0.5);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
    }

    .scrubber-spacer-track {
      position: relative;
      z-index: 5;
    }

    .event-block *, .event-point * {
      pointer-events: none;
    }

    .event-block .title, .event-point .title {
      font-weight: 700;
      font-size: 0.72rem;
      line-height: 1.15;
      white-space: normal;
      word-break: break-word;
    }

    .event-block .subtitle, .event-point .subtitle {
      font-size: 0.62rem;
      color: var(--text-muted);
      line-height: 1.15;
      white-space: normal;
      word-break: break-word;
      margin-top: 2px;
    }

    /* --- Universal Spotlight Transition --- */
    .spine-dot, .spine-pill, .connector-line, .event-point, .sticky-card-box {
      transition: opacity 0.2s ease, transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Center Spine Dot */
    .spine-dot {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 50;
      cursor: pointer;
    }

    /* Concentric Range Pills */
    .spine-pill {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      cursor: pointer;
    }

    .spine-dot.muted {
      background-color: #475569 !important;
      box-shadow: none !important;
    }

    .spine-pill.muted {
      background-color: rgba(71, 85, 105, 0.2) !important;
      border-color: #475569 !important;
    }

    /* Connector Line (Absolute for point events, Sticky for range events) */
    .connector-line {
      position: absolute;
      top: 0;
      height: 1px;
      z-index: 45;
      pointer-events: none;
    }

    .event-point.range-event .connector-line {
      position: sticky;
      top: calc(var(--header-total-height) + 12px + 16px);
    }

    /* Outer Card Boundary Container */
    .event-point {
      position: absolute;
      z-index: 40;
      cursor: pointer;
      touch-action: none;
      width: 38%;
      box-sizing: border-box;
      background: transparent;
    }

    /* Inner Visual Compact Card (Sticky inside its range boundary) */
    .sticky-card-box {
      position: sticky;
      top: calc(var(--header-total-height) + 12px);
      padding: 5px 8px;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 4px;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      width: 100%;
    }

    .event-point.branch-left { text-align: right; }
    .event-point.branch-right { text-align: left; }

    /* --- HOVER SPOTLIGHT ENGINE --- */
    .data-track.has-hover .spine-dot,
    .data-track.has-hover .spine-pill,
    .data-track.has-hover .connector-line,
    .data-track.has-hover .event-point {
      opacity: 0.15;
    }

    .data-track.has-hover .spine-dot.hover-active,
    .data-track.has-hover .spine-pill.hover-active,
    .data-track.has-hover .connector-line.hover-active,
    .data-track.has-hover .event-point.hover-active {
      opacity: 1 !important;
      z-index: 70 !important;
    }

    .data-track.has-hover .event-point.hover-active .sticky-card-box {
      background: rgba(30, 41, 59, 0.98);
      box-shadow: 0 4px 14px rgba(0,0,0,0.7);
    }

    /* --- Scrubber Rail --- */
    .scrubber-rail {
      position: fixed;
      right: 0;
      top: var(--header-total-height);
      bottom: 0;
      width: var(--scrubber-width);
      z-index: 200;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      user-select: none;
      touch-action: none;
    }

    .scrub-tick {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .scrub-tick.dot::before {
      content: "";
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0.8;
    }

    .scrub-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-gold);
      pointer-events: none;
      line-height: 1;
    }

    .scrub-indicator {
      position: absolute;
      right: 3px;
      width: 30px;
      background: rgba(245, 158, 11, 0.3);
      border: 1px solid var(--accent-gold);
      border-radius: 4px;
      pointer-events: none;
      transition: top 0.05s linear;
    }

    /* --- Modals --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--accent-gold);
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover { color: var(--text-main); }

    .modal-type {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-gold);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .modal-dates {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .modal-body {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <header class="toolbar">
    <span class="toolbar-title">Bible Timeline</span>

    <div class="zoom-controls">
      <span class="zoom-level-text" id="zoom-level-text">1.0×</span>
      <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out">−</button>
      <input type="range" id="zoom-slider" class="zoom-slider" min="1" max="100" step="0.1" value="1">
      <button class="zoom-btn" id="btn-zoom-in" title="Zoom In">+</button>
    </div>
  </header>

  <!-- Google Maps Style Layer Toggles -->
  <div class="layers-bar" id="layers-bar"></div>

  <div class="scrubber-rail" id="scrubber-rail">
    <div class="scrub-indicator" id="scrub-indicator"></div>
  </div>

  <main class="timeline-container">
    <div class="timeline-canvas" id="timeline-canvas">
      <div class="year-track" id="year-track"></div>
      <div class="data-track" id="single-data-track"></div>
      <div class="scrubber-spacer-track"></div>
    </div>
  </main>

  <!-- Event Detail Modal Overlay -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-type" id="modal-type">Category</div>
      <h2 class="modal-title" id="modal-title">Event Title</h2>
      <div class="modal-dates" id="modal-dates">Years</div>
      <div class="modal-body" id="modal-body">Description text goes here.</div>
    </div>
  </div>

  <script>
    const START_YEAR = -4000;
    const END_YEAR = 100;
    const TOTAL_YEARS = END_YEAR - START_YEAR;
    const CANVAS_PADDING_TOP = 20;

    const MIN_ZOOM = 1.0;
    const MAX_ZOOM = 100.0;
    let currentZoomLevel = 1.0;

    let basePixelsPerYear = 0.2;
    let pixelsPerYear = basePixelsPerYear;
    let renderPending = false;

    // Available Datasets
    const CATEGORIES = {
      'big-story': 'The Big Story',
      'books-narrative': 'Books Narrative',
      'books-writings': 'Other Books',
      'genealogy': 'Genealogy',
      'kings-judah': 'Kings of Judah',
      'kings-israel': 'Kings of Israel',
      'prophets': 'Prophets',
      'empires': 'Empires'
    };

    // Dynamic Color Sequence for Layers
    const PALETTE = ['#38bdf8', '#a855f7', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4', '#ec4899', '#84cc16'];

    // All 8 Layers Active by Default
    let activeLayers = Object.keys(CATEGORIES);
    const dataCache = {};

    // DOM References
    const layersBar = document.getElementById('layers-bar');
    const targetTrack = document.getElementById('single-data-track');
    const yearTrack = document.getElementById('year-track');
    const canvas = document.getElementById('timeline-canvas');
    const scrubberRail = document.getElementById('scrubber-rail');
    const scrubIndicator = document.getElementById('scrub-indicator');

    const zoomSlider = document.getElementById('zoom-slider');
    const zoomLevelText = document.getElementById('zoom-level-text');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomIn = document.getElementById('btn-zoom-in');

    const modal = document.getElementById('event-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalType = document.getElementById('modal-type');
    const modalDates = document.getElementById('modal-dates');
    const modalBody = document.getElementById('modal-body');
    const modalClose = document.getElementById('modal-close');

    function calculateBaseScale() {
      const headerTotalHeight = 93;
      const availableHeight = Math.max(300, window.innerHeight - headerTotalHeight - (CANVAS_PADDING_TOP * 2));
      basePixelsPerYear = availableHeight / TOTAL_YEARS;
      pixelsPerYear = basePixelsPerYear * currentZoomLevel;
    }

    function renderLayersBarUI() {
      layersBar.innerHTML = '';
      Object.entries(CATEGORIES).forEach(([key, title]) => {
        const isActive = activeLayers.includes(key);
        const layerIdx = activeLayers.indexOf(key);

        let dotColor = '#64748b';
        if (isActive) {
          if (key === 'kings-judah') dotColor = '#f59e0b';
          else if (key === 'kings-israel') dotColor = '#ef4444';
          else dotColor = PALETTE[layerIdx % PALETTE.length];
        }

        const chip = document.createElement('div');
        chip.className = `layer-chip ${isActive ? 'active' : ''}`;
        chip.innerHTML = `
          <span class="layer-color-dot" style="background-color: ${dotColor}; color: ${dotColor};"></span>
          <span>${title}</span>
        `;

        chip.addEventListener('click', async () => {
          if (isActive) {
            if (activeLayers.length > 1) {
              activeLayers = activeLayers.filter(k => k !== key);
            }
          } else {
            activeLayers.push(key);
            await fetchCategoryData(key);
          }
          renderLayersBarUI();
          renderTimeline();
        });

        layersBar.appendChild(chip);
      });
    }

    async function loadTimeline() {
      calculateBaseScale();
      renderLayersBarUI();
      rebuildCanvasLayout();
      setupZoomListeners();
      setupModalListeners();

      await Promise.all(Object.keys(CATEGORIES).map(k => fetchCategoryData(k)));
      renderTimeline();

      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          calculateBaseScale();
          rebuildCanvasLayout();
        }, 150);
      });
    }

    function rebuildCanvasLayout() {
      setupCanvasHeight();
      renderYearAxisAndGridLines();
      renderTimeline();
      buildScrubberRail();
      setupTouchScrubber();
      updateScrubberPosition();
    }

    function setZoomLevel(targetZoom, keepYearCentered = true) {
      const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoom));
      if (Math.abs(newZoom - currentZoomLevel) < 0.001) return;

      const currentScrollY = window.scrollY;
      const centerViewportY = currentScrollY + (window.innerHeight / 2);
      const yearAtCenter = START_YEAR + ((centerViewportY - CANVAS_PADDING_TOP) / pixelsPerYear);

      currentZoomLevel = newZoom;
      pixelsPerYear = basePixelsPerYear * currentZoomLevel;

      zoomSlider.value = currentZoomLevel;
      zoomLevelText.textContent = `${currentZoomLevel.toFixed(1)}×`;

      if (!renderPending) {
        renderPending = true;
        requestAnimationFrame(() => {
          rebuildCanvasLayout();
          if (keepYearCentered) {
            const newCenterViewportY = CANVAS_PADDING_TOP + ((yearAtCenter - START_YEAR) * pixelsPerYear);
            const newScrollY = newCenterViewportY - (window.innerHeight / 2);
            window.scrollTo({ top: newScrollY, behavior: 'instant' });
          }
          renderPending = false;
        });
      }
    }

    function setupZoomListeners() {
      zoomSlider.addEventListener('input', (e) => setZoomLevel(parseFloat(e.target.value)));
      btnZoomOut.addEventListener('click', () => setZoomLevel(currentZoomLevel / 1.4));
      btnZoomIn.addEventListener('click', () => setZoomLevel(currentZoomLevel * 1.4));
      zoomLevelText.addEventListener('dblclick', () => setZoomLevel(1.0));

      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
          setZoomLevel(currentZoomLevel * zoomFactor);
        }
      }, { passive: false });

      let initialTouchDistance = null;
      let touchStartZoom = currentZoomLevel;

      document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialTouchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          touchStartZoom = currentZoomLevel;
        }
      }, { passive: true, capture: true });

      document.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialTouchDistance && initialTouchDistance > 0) {
          if (e.cancelable) e.preventDefault();
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scaleRatio = currentDistance / initialTouchDistance;
          setZoomLevel(touchStartZoom * scaleRatio);
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchend', () => {
        initialTouchDistance = null;
      }, { capture: true });
    }

    function openEventModal(event) {
      modalTitle.textContent = event.title;
      modalType.textContent = event.subtitle || CATEGORIES[event.layerKey] || 'Event Details';
      
      const startStr = event.startYear < 0 ? `${Math.abs(event.startYear)} BC` : `${event.startYear} AD`;
      const endStr = event.endYear < 0 ? `${Math.abs(event.endYear)} BC` : `${event.endYear} AD`;
      modalDates.textContent = event.startYear === event.endYear ? startStr : `${startStr} – ${endStr}`;
      modalBody.textContent = event.description || "Detailed notes, key verses, or historical context for this period can be populated in your JSON files.";

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    function setupModalListeners() {
      modalClose.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    }

    async function fetchCategoryData(categoryKey) {
      if (!categoryKey || dataCache[categoryKey]) return dataCache[categoryKey];
      try {
        const response = await fetch(`data/${categoryKey}.json?v=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const rawData = await response.json();
        
        if (Array.isArray(rawData)) {
          dataCache[categoryKey] = { metadata: {}, events: rawData };
        } else {
          dataCache[categoryKey] = {
            metadata: rawData.metadata || {},
            events: rawData.events || []
          };
        }
        
        return dataCache[categoryKey];
      } catch (error) {
        console.error(`Error loading dataset 'data/${categoryKey}.json':`, error);
        return { metadata: {}, events: [] };
      }
    }

    function getYearOffset(year) {
      return CANVAS_PADDING_TOP + ((year - START_YEAR) * pixelsPerYear);
    }

    function setupCanvasHeight() {
      const totalHeight = (TOTAL_YEARS * pixelsPerYear) + (CANVAS_PADDING_TOP * 2);
      canvas.style.height = `${totalHeight}px`;
    }

    function renderYearAxisAndGridLines() {
      yearTrack.innerHTML = '';
      canvas.querySelectorAll('.grid-line').forEach(l => l.remove());

      const showDecades = pixelsPerYear >= 1.0;
      const showAnnuals = pixelsPerYear >= 12.0;

      for (let y = START_YEAR; y <= END_YEAR; y++) {
        if (y === 0) continue;
        const absYear = Math.abs(y);
        const topPos = getYearOffset(y);

        if (absYear % 1000 === 0 || y === 1) {
          const labelText = y === 1 ? '1 AD' : `${absYear}`;
          addMarkerAndLine(topPos, labelText, 'millennium');
        } else if (absYear % 100 === 0) {
          const centuryStyle = showDecades ? 'century' : 'decade';
          addMarkerAndLine(topPos, absYear, centuryStyle);
        } else if (absYear % 10 === 0 && showDecades) {
          addMarkerAndLine(topPos, absYear, 'decade');
        } else if (showAnnuals) {
          addMarkerAndLine(topPos, absYear, 'annual');
        }
      }
    }

    function addMarkerAndLine(topPos, labelText, typeClass) {
      const marker = document.createElement('div');
      marker.className = `year-marker ${typeClass}`;
      marker.style.top = `${topPos}px`;
      marker.textContent = labelText;

      const gridLine = document.createElement('div');
      gridLine.className = `grid-line ${typeClass}`;
      gridLine.style.top = `${topPos}px`;

      yearTrack.appendChild(marker);
      canvas.appendChild(gridLine);
    }

    function attachHoverSpotlight(groupId, ...elements) {
      elements.forEach(el => {
        if (!el) return;
        el.dataset.groupId = groupId;

        el.addEventListener('mouseenter', () => {
          targetTrack.classList.add('has-hover');
          document.querySelectorAll(`[data-group-id="${groupId}"]`).forEach(matched => {
            matched.classList.add('hover-active');
          });
        });

        el.addEventListener('mouseleave', () => {
          targetTrack.classList.remove('has-hover');
          document.querySelectorAll(`[data-group-id="${groupId}"]`).forEach(matched => {
            matched.classList.remove('hover-active');
          });
        });
      });
    }

    function renderTimeline() {
      targetTrack.innerHTML = '';
      const allCombinedEvents = [];

      activeLayers.forEach((catKey, layerIdx) => {
        if (!dataCache[catKey] || !dataCache[catKey].events) return;

        let layerColor = PALETTE[layerIdx % PALETTE.length];
        if (catKey === 'kings-judah') layerColor = '#f59e0b';
        if (catKey === 'kings-israel') layerColor = '#ef4444';

        dataCache[catKey].events.forEach(ev => {
          allCombinedEvents.push({
            ...ev,
            layerKey: catKey,
            layerColor: ev.color || layerColor
          });
        });
      });

      if (allCombinedEvents.length === 0) return;

      allCombinedEvents.sort((a, b) => a.startYear - b.startYear);

      const eventToSpinePillMap = new Map();

      // --- 1. CONCENTRIC GOBSTOPPER RING ENGINE FOR RANGE PILLS ---
      const rangeEvents = allCombinedEvents.filter(e => !e.isPointEvent && (e.endYear - e.startYear) > 0);

      rangeEvents.forEach((event) => {
        const topPos = getYearOffset(event.startYear);
        const rawDuration = event.endYear - event.startYear;
        const pillHeight = Math.max(14, rawDuration * pixelsPerYear);

        const activeOverlaps = rangeEvents.filter(other => 
          event !== other && 
          Math.max(event.startYear, other.startYear) < Math.min(event.endYear, other.endYear)
        );

        const overlapIndex = activeOverlaps.filter(other => 
          (other.endYear - other.startYear) > rawDuration || 
          ((other.endYear - other.startYear) === rawDuration && other.title < event.title)
        ).length;

        const pillWidthPx = 10 + (overlapIndex * 4);
        const pillRadiusPx = pillWidthPx / 2;
        const zIndexVal = 30 - overlapIndex;

        const pill = document.createElement('div');
        pill.className = 'spine-pill';
        pill.style.top = `${topPos}px`;
        pill.style.height = `${pillHeight}px`;
        pill.style.width = `${pillWidthPx}px`;
        pill.style.borderRadius = `${pillRadiusPx}px`;
        pill.style.zIndex = zIndexVal;
        pill.style.backgroundColor = `${event.layerColor}33`;
        pill.style.border = `2px solid ${event.layerColor}`;

        const startStr = event.startYear < 0 ? `${Math.abs(event.startYear)} BC` : `${event.startYear} AD`;
        const endStr = event.endYear < 0 ? `${Math.abs(event.endYear)} BC` : `${event.endYear} AD`;
        pill.title = `${event.title} (${startStr} – ${endStr})`;

        pill.addEventListener('click', () => openEventModal(event));
        
        eventToSpinePillMap.set(event, pill);
        targetTrack.appendChild(pill);
      });

      // --- 2. POINT DOTS AND ALTERNATING CARDS ---
      const MIN_VERTICAL_GAP_PX = 30;
      let lastLeftTopPx = -9999;
      let lastRightTopPx = -9999;

      allCombinedEvents.forEach((event, eventIdx) => {
        const topPos = getYearOffset(event.startYear);
        const rawDuration = event.endYear - event.startYear;
        const isPoint = event.isPointEvent || rawDuration === 0;

        const side = (eventIdx % 2 === 0) ? 'left' : 'right';
        const itemColor = event.layerColor;

        const lastTopPx = (side === 'left') ? lastLeftTopPx : lastRightTopPx;
        const gapPx = topPos - lastTopPx;
        const isCollided = gapPx < MIN_VERTICAL_GAP_PX;

        const groupId = `group-${eventIdx}-${event.title.replace(/\s+/g, '-')}`;

        let dotEl = null;
        if (isPoint) {
          dotEl = document.createElement('div');
          dotEl.className = `spine-dot ${isCollided ? 'muted' : ''}`;
          dotEl.style.top = `${topPos}px`;
          if (!isCollided) {
            dotEl.style.backgroundColor = itemColor;
            dotEl.style.boxShadow = `0 0 6px ${itemColor}`;
          }
          const yearStr = event.startYear < 0 ? `${Math.abs(event.startYear)} BC` : `${event.startYear} AD`;
          dotEl.title = `${event.title} (${yearStr})`;
          dotEl.addEventListener('click', () => openEventModal(event));
          targetTrack.appendChild(dotEl);
        }

        const spineMarker = isPoint ? dotEl : eventToSpinePillMap.get(event);

        if (!isCollided) {
          if (side === 'left') lastLeftTopPx = topPos;
          else lastRightTopPx = topPos;

          const cardContainer = document.createElement('div');
          cardContainer.className = `event-point branch-${side} ${isPoint ? 'point-event' : 'range-event'}`;
          cardContainer.style.top = `${topPos}px`;

          if (!isPoint) {
            const boundaryHeight = Math.max(32, rawDuration * pixelsPerYear);
            cardContainer.style.height = `${boundaryHeight}px`;
          }

          cardContainer.addEventListener('click', () => openEventModal(event));

          const line = document.createElement('div');
          line.className = 'connector-line';
          line.style.borderTop = `1px solid ${itemColor}`;

          if (side === 'left') {
            cardContainer.style.right = '54%';
            line.style.right = '50%';
            line.style.width = '4%';
          } else {
            cardContainer.style.left = '54%';
            line.style.left = '50%';
            line.style.width = '4%';
          }

          const cardBox = document.createElement('div');
          cardBox.className = 'sticky-card-box';
          if (side === 'left') {
            cardBox.style.borderRight = `3px solid ${itemColor}`;
          } else {
            cardBox.style.borderLeft = `3px solid ${itemColor}`;
          }

          cardBox.innerHTML = `
            <div class="title">${event.title}</div>
            <div class="subtitle">${event.subtitle || ''}</div>
          `;

          cardContainer.appendChild(line);
          cardContainer.appendChild(cardBox);

          attachHoverSpotlight(groupId, cardContainer, spineMarker);

          targetTrack.appendChild(cardContainer);
        } else if (spineMarker) {
          attachHoverSpotlight(groupId, spineMarker);
        }
      });
    }

    function buildScrubberRail() {
      scrubberRail.querySelectorAll('.scrub-tick').forEach(t => t.remove());
      const majorMilestones = new Map([[-4000, "4k"], [-3000, "3k"], [-2000, "2k"], [-1000, "1k"], [1, "1 AD"]]);

      for (let y = START_YEAR; y <= END_YEAR; y += 100) {
        if (y === 0) continue;
        const tickKey = y;
        const tick = document.createElement('div');
        tick.className = 'scrub-tick';

        if (majorMilestones.has(tickKey)) {
          const label = document.createElement('span');
          label.className = 'scrub-label';
          label.textContent = majorMilestones.get(tickKey);
          tick.appendChild(label);
        } else {
          tick.classList.add('dot');
        }

        scrubberRail.appendChild(tick);
      }
    }

    function updateScrubberPosition() {
      const rect = scrubberRail.getBoundingClientRect();
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      
      if (maxScroll <= 0) {
        scrubIndicator.style.height = `${rect.height}px`;
        scrubIndicator.style.top = `0px`;
        return;
      }

      const viewportRatio = window.innerHeight / document.documentElement.scrollHeight;
      const indicatorHeight = Math.max(16, rect.height * viewportRatio);
      
      const scrollPercentage = Math.max(0, Math.min(1, window.scrollY / maxScroll));
      const availableTravel = rect.height - indicatorHeight;
      const indicatorTop = scrollPercentage * availableTravel;

      scrubIndicator.style.height = `${indicatorHeight}px`;
      scrubIndicator.style.top = `${indicatorTop}px`;
    }

    function setupTouchScrubber() {
      function scrubToY(clientY) {
        const rect = scrubberRail.getBoundingClientRect();
        const viewportRatio = window.innerHeight / document.documentElement.scrollHeight;
        const indicatorHeight = Math.max(16, rect.height * viewportRatio);
        const availableTravel = rect.height - indicatorHeight;

        if (availableTravel <= 0) return;

        const targetTop = clientY - rect.top - (indicatorHeight / 2);
        const percentage = Math.max(0, Math.min(1, targetTop / availableTravel));
        
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo({ top: percentage * maxScroll, behavior: 'instant' });
        updateScrubberPosition();
      }

      let isScrubbing = false;

      scrubberRail.addEventListener('mousedown', (e) => { isScrubbing = true; scrubToY(e.clientY); });
      window.addEventListener('mousemove', (e) => { if (isScrubbing) scrubToY(e.clientY); });
      window.addEventListener('mouseup', () => isScrubbing = false);

      scrubberRail.addEventListener('touchstart', (e) => { isScrubbing = true; scrubToY(e.touches[0].clientY); }, { passive: true });
      scrubberRail.addEventListener('touchmove', (e) => { if (isScrubbing) scrubToY(e.touches[0].clientY); }, { passive: true });
      scrubberRail.addEventListener('touchend', () => isScrubbing = false);

      window.addEventListener('scroll', updateScrubberPosition, { passive: true });
    }

    loadTimeline();
  </script>
</body>
</html>
