<!-- Main Timeline Grid -->
  <main class="timeline-container" id="timeline-grid">
    <!-- Headers -->
    <div class="col-header year-header">Year</div>

    <div class="col-header">
      <select class="column-select" id="select-col-1">
        <option value="kings-judah" selected>Kings of Judah</option>
        <option value="kings-israel">Kings of Israel</option>
        <option value="prophets">Prophets & Books</option>
        <option value="empires">Rulers & Empires</option>
      </select>
    </div>

    <div class="col-header">
      <select class="column-select" id="select-col-2">
        <option value="kings-judah">Kings of Judah</option>
        <option value="kings-israel">Kings of Israel</option>
        <option value="prophets" selected>Prophets & Books</option>
        <option value="empires">Rulers & Empires</option>
      </select>
    </div>

    <!-- Rows will be injected dynamically here by JS -->
    <div id="timeline-rows-container" style="display: contents;"></div>
  </main>

  <script>
    let timelineData = [];

    const col1Select = document.getElementById('select-col-1');
    const col2Select = document.getElementById('select-col-2');
    const rowsContainer = document.getElementById('timeline-rows-container');

    // Fetch JSON and initialize
    async function loadTimeline() {
      try {
        const response = await fetch('timeline.json');
        timelineData = await response.json();
        renderTimeline();
      } catch (error) {
        console.error('Error loading timeline data:', error);
      }
    }

    // Render timeline based on selected dropdown keys
    function renderTimeline() {
      const key1 = col1Select.value;
      const key2 = col2Select.value;

      rowsContainer.innerHTML = '';

      timelineData.forEach(row => {
        // Create Timeline Row wrapper
        const rowDiv = document.createElement('div');
        rowDiv.className = 'timeline-row';

        // Year Cell
        const yearCell = document.createElement('div');
        yearCell.className = 'timeline-cell year-cell';
        if (row.id) yearCell.id = row.id;
        yearCell.textContent = row.year;
        rowDiv.appendChild(yearCell);

        // Column 1 Cell
        const cell1 = document.createElement('div');
        cell1.className = 'timeline-cell';
        renderCards(cell1, row.columns[key1] || []);
        rowDiv.appendChild(cell1);

        // Column 2 Cell
        const cell2 = document.createElement('div');
        cell2.className = 'timeline-cell';
        renderCards(cell2, row.columns[key2] || []);
        rowDiv.appendChild(cell2);

        rowsContainer.appendChild(rowDiv);
      });
    }

    // Helper to generate event cards inside a cell
    function renderCards(containerCell, events) {
      if (events.length === 0) return;

      events.forEach(event => {
        const card = document.createElement('div');
        card.className = `event-card ${event.type || ''}`;

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = event.title;

        const subtitle = document.createElement('div');
        subtitle.className = 'subtitle';
        subtitle.textContent = event.subtitle;

        card.appendChild(title);
        card.appendChild(subtitle);
        containerCell.appendChild(card);
      });
    }

    // Event listeners for dropdowns
    col1Select.addEventListener('change', renderTimeline);
    col2Select.addEventListener('change', renderTimeline);

    // Initial Load
    loadTimeline();
  </script>
</body>
</html>
